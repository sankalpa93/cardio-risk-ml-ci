name: Cardio Risk - Kubernetes CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sankalpa93/cardio-risk-ml

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train cardio risk model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Create immutable image reference
        id: image
        run: echo "image_ref=${IMAGE}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for testing
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t cardio-risk-ml:test .

      - name: Start test container
        run: docker run -d --name cardio-risk-test -p 5000:5000 cardio-risk-ml:test

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo ""
              echo "Container health test passed"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          docker logs cardio-risk-test
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"age_years":55,"gender":1,"height":165,"weight":80,"ap_hi":140,"ap_lo":90,"cholesterol":2,"gluc":1,"smoke":0,"alco":0,"active":1}')
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Stop test container
        if: always()
        run: docker rm -f cardio-risk-test || true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag tested image
        run: |
          docker tag cardio-risk-ml:test ${IMAGE}:sha-${{ github.sha }}
          docker tag cardio-risk-ml:test ${IMAGE}:latest

      - name: Push tested image to GHCR
        run: |
          docker push ${IMAGE}:sha-${{ github.sha }}
          docker push ${IMAGE}:latest

  deploy-kubernetes:
    needs: build-test-push
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Verify Kubernetes cluster
        run: kubectl get nodes

      - name: Show current deployment
        run: kubectl get deployment cardio-risk-prediction -o wide

      - name: Deploy the tested image
        id: setimage
        run: kubectl set image deployment/cardio-risk-prediction cardio-risk-api=${{ needs.build-test-push.outputs.image_ref }}

      - name: Wait for Kubernetes rollout
        run: kubectl rollout status deployment/cardio-risk-prediction --timeout=180s

      - name: Verify health through the Kubernetes Service
        run: kubectl exec deployment/cardio-risk-prediction -- python -c "import urllib.request; print(urllib.request.urlopen('http://cardio-risk-prediction-service/health', timeout=10).read().decode())"

      - name: Show deployed image and Pods
        run: |
          kubectl get deployment cardio-risk-prediction -o wide
          kubectl get pods -o wide

      - name: Roll back if deployment verification fails
        if: failure() && steps.setimage.conclusion == 'success'
        run: |
          kubectl rollout undo deployment/cardio-risk-prediction
          kubectl rollout status deployment/cardio-risk-prediction --timeout=180s
