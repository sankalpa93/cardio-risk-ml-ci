name: Build, Test and Publish Cardio Risk Prediction

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cardio-risk-ml

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model (needed inside the Docker image)
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE_NAME:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name cardio-risk-ci \
            -p 5000:5000 \
            $IMAGE_NAME:ci

      - name: Test API health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done
          echo "Health check failed."
          docker logs cardio-risk-ci
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"age_years":55,"gender":1,"height":165,"weight":80,"ap_hi":140,"ap_lo":90,"cholesterol":2,"gluc":1,"smoke":0,"alco":0,"active":1}')
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Remove test container
        if: always()
        run: docker rm -f cardio-risk-ci || true

      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login $REGISTRY \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag tested image
        run: |
          docker tag $IMAGE_NAME:ci $IMAGE_ID:latest
          docker tag $IMAGE_NAME:ci $IMAGE_ID:sha-${{ github.sha }}

      - name: Push tested image to GHCR
        run: |
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:sha-${{ github.sha }}
